# polym2 overrides for a private, bounded collection run.
#
# Layered on top of docker-compose.polymarket.yml, never instead of it:
#
#   docker compose -f docker-compose.polymarket.yml -f docker-compose.polym2.yml up -d --build
#
# Deliberately a separate file rather than edits in place, so the fork stays
# readable as a diff against upstream. Five departures from upstream:
#
#   1. EXCLUDE_HASH=false — we keep Polymarket's book hash in the data. Upstream
#      strips it; we need it to audit the dedup change after the fact.
#   2. LOCAL_OUTPUT_DIR — hourly Parquet lands on disk instead of in R2, in the
#      same `polymarket/v2/` layout the pmxt mirror uses, so polym2's
#      research/ scripts read it unchanged via PMXT_ARCHIVE_ROOT.
#   3. TTL_MINUTES — ClickHouse is a buffer for the exporter, not the archive.
#      Only takes effect on a *fresh* table: the sink applies the TTL clause at
#      CREATE TABLE, so changing it later does nothing until the table is
#      dropped.
#   4. MAX_ASSETS_PER_CONN + PONG_TIMEOUT_SECONDS — one pair, not two settings;
#      see below.
#   5. Log rotation on every service. Not a collector setting at all, but the
#      run has already lost a disk to it once — see the bottom of this file.
#
# COLLECTOR_OUT is the host directory the snapshots are written to; set it in
# .env or the environment. Everything else is upstream's default.

x-logging: &rotated-logs
  # json-file with no options grows without bound. During the 2026-08-04 run the
  # WS pool alone wrote a 36.7 GB log in eleven hours — `asset_degraded` /
  # `asset_healthy` at churn rate — and `docker logs` on it became unusable
  # because every query rescans the file from the start. 300 MB x 3 is ample for
  # diagnosing a stall and bounds the whole pool at ~3.6 GB.
  driver: json-file
  options:
    max-size: "300m"
    max-file: "3"

services:
  obdata-polymarket-active-markets:
    logging: *rotated-logs

  obdata-polymarket-orderbook-rust-pubsub:
    logging: *rotated-logs
    environment:
      EXCLUDE_HASH: "false"
      # MAX_ASSETS_PER_CONN and PONG_TIMEOUT_SECONDS are one decision.
      #
      # Upstream's 500 puts ~272k assets on ~1090 connections, which does not
      # hold from a single address: ~109 PING/s starts timing out, every timeout
      # reconnects and re-subscribes that connection's assets, and the added
      # load times out the next batch. Observed half the pool down and
      # worsening, with 64k assets on no live connection at all.
      #
      # 2500 puts the same universe on ~220 connections and traded that failure
      # for the opposite one: PONG is a text message in the *same* stream as the
      # data, so on a socket carrying 2500 assets it queues behind thousands of
      # data messages and cannot answer within the old 5 s. 84% of PINGs timed
      # out and the pool churned just as badly.
      #
      # So the connection count needs the timeout raised with it. 60 s is still
      # far tighter than "this socket is dead" requires, and the heartbeat's
      # only job is detecting death — a healthy busy socket is not a dead one.
      #
      # Raising this was impossible before the fix in ws/connection.rs: the
      # overdue check measured from the most recent PING, which the ticker
      # rewrote every PING_INTERVAL, so any value at or above PING_INTERVAL
      # silently disabled dead-connection detection instead of loosening it.
      MAX_ASSETS_PER_CONN: "2500"
      PONG_TIMEOUT_SECONDS: "60"

  obdata-polymarket-orderbook-rust-from-pubsub:
    logging: *rotated-logs
    environment:
      EXCLUDE_HASH: "false"
      # 6 hours, down from the 2 days this started at. ClickHouse is a buffer
      # for the exporter, which lags one hour -- 6 gives it six times the margin
      # it needs and nothing here is the archive.
      #
      # The 2-day value was sized against the archive's ~24.5k rows/s. Our fork
      # captures ~36k rows/s, because keeping the events upstream's hash-dedup
      # dropped is the entire point, and at that rate a 2-day table is ~6.3
      # billion rows. Background merges over it took ClickHouse to 5.4 GB RSS on
      # a 14 GB host shared with a dozen other services, and the kernel OOM-killed
      # it 17 times in 75 minutes on 2026-08-05. Every one of those restarts is a
      # permanent hole, because the sink is fire-and-forget.
      #
      # 6 hours puts the table near 780M rows and the merges within budget.
      # TTL is applied in CREATE TABLE, so changing this needs a fresh table.
      TTL_MINUTES: "360"

  obdata-polymarket-r2-archive-exporter:
    logging: *rotated-logs
    # Measured, not guessed: streaming the 153M-row hour of 2026-08-05T16
    # plateaued at 1.12 GiB and finished in 543 s. It plateaus rather than
    # ramping, which is the whole point — the same figure should hold for any
    # hour, since peak is one row group and not the export.
    #
    # 2g leaves ~80% headroom over that measurement. It bounds a regression to
    # this container, where restart: unless-stopped revives it and the hour is
    # retried, instead of the kernel picking a victim across a 14 GB host. On
    # 2026-08-05 it picked this process at 5.5 GB, and before that ClickHouse.
    #
    # PARQUET_ROW_GROUP_ROWS is the knob if this ever needs to be smaller;
    # halving it roughly halves the plateau, at the cost of more dictionary
    # restarts and a larger footer.
    mem_limit: 2g
    environment:
      LOCAL_OUTPUT_DIR: /out
    volumes:
      - ${COLLECTOR_OUT:?set COLLECTOR_OUT to the host output directory}:/out
